{% extends 'dashboard/base.html' %} 
{% load static %}
{% block content %}

<div class="container">
    <div class="row">
        {% for note in notes %}
        <div class="col-md-3">

            <div class="card">
                <!-- Title clickable -->
                <div class="card-header">
                    <a href="{% url 'notes-detail' note.id %}">
                        {{ note.title }}
                    </a>
                </div>

                <div class="card-body">
                    {{ note.description|slice:"0:100" }}
                </div>

                <div class="card-footer mt-auto d-flex justify-content-between">
                    <!-- View details -->
                    <a href="{% url 'notes-detail' note.id %}" class="btn btn-sm btn-primary">
                        View
                    </a>

                    <!-- Delete -->
                    <a href="{% url 'delete-note' note.id %}">
                        <i class="fa fa-trash fa-2x text-danger"></i>
                    </a>
                </div>
            </div>

        </div>
        {% endfor %}
    </div>
</div>

<br><br>

<div class="container">
    <form method="POST">
        {% csrf_token %}

        <fieldset class="form-group">
            <legend class="border-bottom mb-4">Create Notes</legend>
        </fieldset>

        {{ form }}

        <div class="form-group">
            <button class="btn btn-outline-info" type="submit">
                Create
            </button>
        </div>
    </form>
</div>

{% endblock content %}
